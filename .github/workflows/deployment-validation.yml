name: Production deployment validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Validate migration, deployment, and health stages
        run: pnpm deploy:validate:production
